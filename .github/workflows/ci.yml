name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for exposed secrets
        run: |
          # Length AND boundary are both required. Length alone still matched
          # "after-task-async-storage-instance"; boundary alone still matched
          # "sk-1". Real keys are preceded by a quote, space, or '='.
          if grep -rE '(^|[^A-Za-z0-9])(sbp_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})' \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' \
               --include='*.md' --include='*.yml' --include='*.yaml' \
               --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next . ; then
            echo "::error::Potential secret detected in repo. Remove before merging."
            exit 1
          fi

      - name: Truthful-claims check
        run: python3 scripts/check-claims.py

      - name: TypeScript check (if tsc available)
        run: npx tsc --noEmit 2>/dev/null || echo "tsc not configured — skipping"

      - name: Static site smoke test
        run: |
          # Bounded: start a server, fetch the page, stop. `npm run dev` runs
          # `npx serve .`, which never exits and would hang the job.
          python3 -m http.server 4173 --bind 127.0.0.1 >/dev/null 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:4173/index.html >/dev/null
          echo "index.html served OK"

          # Every page the footer links to must exist. A "Privacy Policy"
          # pointing at "#" is worse than no link at all.
          for page in \
            index.html immigration.html auth.html dashboard.html \
            legal/privacy.html legal/terms.html legal/refund.html \
            legal/cookies.html legal/dpa.html legal/subprocessors.html \
            legal/security.html; do
            curl -sf "http://127.0.0.1:4173/$page" >/dev/null \
              || { echo "::error::missing page: $page"; exit 1; }
          done
          echo "all pages served OK"

      - name: No dead legal links
        run: |
          # Fail if any footer/legal anchor still points at "#".
          if grep -nE '<a[^>]+href="#"' index.html immigration.html auth.html dashboard.html; then
            echo "::error::A link points at '#'. Point it at a real page or remove it."
            exit 1
          fi
          echo "no placeholder links"

      - name: Legal pages still carry the draft banner
        run: |
          # The banner comes off only after counsel signs off (see
          # docs/ATTORNEY_BRIEF.md). If someone deletes it, the build says why.
          for page in legal/privacy.html legal/terms.html legal/refund.html \
                      legal/cookies.html legal/dpa.html legal/subprocessors.html; do
            grep -q "not yet reviewed by an attorney" "$page" \
              || { echo "::error::$page is missing the 'draft — pending attorney review' banner"; exit 1; }
          done
          echo "draft banners present"
